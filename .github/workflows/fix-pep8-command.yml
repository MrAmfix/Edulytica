name: fix-pep8-command

on:
  repository_dispatch:
    types: [fix-pep8-command]

jobs:
  fix-pep8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.EDULYTICA_TOKEN }}
          repository: ${{ github.event.client_payload.pull_request.head.repo.full_name }}
          ref: ${{ github.event.client_payload.pull_request.head.ref }}
      - name: Run autopep8 with dynamic exclude pattern
        id: autopep8
        run: |
          # Формируем строку с исключениями, экранируя символы для передачи в autopep8
          EXCLUDE_PATTERN=$(cat .pep8ignore | sed 's/\r//' | sed 's/\//\\\//g' | sed 's/\./\\./g' | tr '\n' ',' | sed 's/,$//')
          echo "Excluding pattern: $EXCLUDE_PATTERN"
          autopep8 . --exit-code --recursive --in-place --aggressive --aggressive --exclude "$EXCLUDE_PATTERN"

      - name: Commit autopep8 changes
        id: cap8c
        if: steps.autopep8.outputs.exit-code == 2
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -am "Automated autopep8 fixes"
          git push
